# Локальное окружение kttf-back.
#
# Только внешние зависимости — база и очередь. Само приложение запускается
# на хосте: перезапуск при правке кода должен быть мгновенным, а пересборка
# образа на каждое изменение этого не даёт.
#
# Порты смещены на 5433 и 6380, чтобы не конфликтовать с уже установленными
# на машине PostgreSQL и Redis.

services:
  postgres:
    image: postgres:17-alpine
    container_name: kttf-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kttf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kttf_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-kttf}
      # Локаль под кириллицу: сортировка фамилий должна быть человеческой
      POSTGRES_INITDB_ARGS: '--locale-provider=icu --icu-locale=ru-RU --encoding=UTF8'
    ports:
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-kttf} -d ${POSTGRES_DB:-kttf}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: kttf-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - '${REDIS_PORT:-6380}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  redis-data:
