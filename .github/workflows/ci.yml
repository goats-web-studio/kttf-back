# CI бэкенда: проверки → образы в GHCR → выкладка (kttf-infra, DEPLOY.md).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Prisma читает адрес базы уже при установке (генерация клиента).
      # Базы в тестах нет — Prisma подменена (README, тесты).
      DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  image:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
      - id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: kttf-api
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/goats-web-studio/kttf-api:${{ steps.tag.outputs.tag }}
            ghcr.io/goats-web-studio/kttf-api:main
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: kttf-migrate
        uses: docker/build-push-action@v6
        with:
          context: .
          target: migrator
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/goats-web-studio/kttf-migrate:${{ steps.tag.outputs.tag }}
            ghcr.io/goats-web-studio/kttf-migrate:main
          # Общая стадия зависимостей с API — её кэш и подхватываем.
          cache-from: |
            type=gha,scope=api
            type=gha,scope=migrate
          cache-to: type=gha,scope=migrate,mode=max

  deploy:
    needs: image
    uses: goats-web-studio/kttf-infra/.github/workflows/deploy.yml@main
    with:
      api_tag: ${{ needs.image.outputs.tag }}
    secrets: inherit
