allowBuilds:
  # Общий код: собирает dist при установке (ADR-010). Ключ содержит SHA,
  # обновляется скриптом scripts/bump-shared.mjs вместе с зависимостью.
  "@kttf/shared@https://codeload.github.com/goats-web-studio/kttf-shared/tar.gz/6808251994be5deb8ebc4424d3c5ec1eda087159": true
  # Prisma скачивает движки постинсталлом — без этого CLI не работает.
  "@prisma/engines": true
  "prisma": true
  # esbuild тянет tsx; без постинсталла не скачивается бинарь.
  "esbuild": true
  # swc компилирует декораторы для Vitest: сам Vitest emitDecoratorMetadata
  # не умеет, а без метаданных внедрение зависимостей Nest не работает.
  "@swc/core": true
