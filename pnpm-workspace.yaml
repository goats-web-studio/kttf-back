allowBuilds:
  # Общий код: собирает dist при установке (ADR-010). Ключ содержит SHA,
  # обновляется скриптом scripts/bump-shared.mjs вместе с зависимостью.
  "@kttf/shared@https://codeload.github.com/goats-web-studio/kttf-shared/tar.gz/54118efb357898ec96580e333bcdb6cef85b23c1": true
  # Prisma скачивает движки постинсталлом — без этого CLI не работает.
  "@prisma/engines": true
  "prisma": true
  # esbuild тянет tsx; без постинсталла не скачивается бинарь.
  "esbuild": true
  # swc компилирует декораторы для Vitest: сам Vitest emitDecoratorMetadata
  # не умеет, а без метаданных внедрение зависимостей Nest не работает.
  "@swc/core": true

overrides:
  # NestJS 11 прибивает multer к 2.2.0, а в нём DoS по именам полей multipart
  # (Dependabot, 27.11.2026). 2.4.0 — те же API и настройки, загрузку по HTTP
  # стережёт test/files.test.ts. Убрать, когда @nestjs/platform-express сам
  # потянет multer ≥ 2.4.0.
  multer: 2.4.0
